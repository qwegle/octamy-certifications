name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/octamy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/octamy_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      SESSION_SECRET: test-session-secret-at-least-32-characters
      PAYMENT_STATUS_SECRET: test-payment-status-secret-at-least-32-chars
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: octamy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d octamy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify append-only migration files and journal
        run: node scripts/validate-migrations.mjs --static-only --base-ref "$MIGRATION_BASE_REF"

      - name: Apply migrations to disposable CI database
        run: npm run db:migrate

      - name: Type-check
        run: npm run check

      - name: Build client and server
        env:
          NODE_ENV: production
        run: npm run build

      - name: Root tests
        run: npx --no-install jest --ci --reporters=default --runInBand

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: Mobile type-check
        run: npm run typecheck --prefix mobile

      - name: Mobile tests
        run: npm test --prefix mobile -- --ci

      - name: Audit high-severity production dependencies (advisory)
        run: npm audit --omit=dev --audit-level=high || true
