name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/octamy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/octamy_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      SESSION_SECRET: test-session-secret-at-least-32-characters
      PAYMENT_STATUS_SECRET: test-payment-status-secret-at-least-32-chars
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: octamy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d octamy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify append-only migration files and journal
        run: node scripts/validate-migrations.mjs --static-only --base-ref "$MIGRATION_BASE_REF"

      - name: Apply migrations to disposable CI database
        run: npm run db:migrate

      - name: Type-check
        run: npm run check

      - name: Build client and server
        env:
          NODE_ENV: production
        run: npm run build

      - name: Root tests
        run: npx --no-install jest --ci --reporters=default --runInBand

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: Mobile type-check
        run: npm run typecheck --prefix mobile

      - name: Mobile tests
        run: npm test --prefix mobile -- --ci

      - name: Audit high-severity production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix mobile --omit=dev --audit-level=high

      - name: Audit development dependencies (non-blocking)
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          npm audit --prefix mobile --audit-level=high

      - name: Record accountable-officer release evidence
        env:
          ACCOUNTABLE_OFFICER: ${{ github.actor }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const evidence = {
            schemaVersion: 1,
            accountableOfficer: process.env.ACCOUNTABLE_OFFICER,
            commit: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            workflowRun: process.env.GITHUB_RUN_ID,
            machineChecks: ['migration-validation', 'database-migration', 'type-check', 'production-build', 'root-tests', 'mobile-type-check', 'mobile-tests', 'production-audit'],
            artifacts: {
              packageLockSha256: sha256('package-lock.json'),
              mobilePackageLockSha256: sha256('mobile/package-lock.json'),
            },
          };
          writeFileSync('release-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(readFileSync('release-evidence.json', 'utf8'));
          NODE
          shasum -a 256 release-evidence.json

      - name: Upload accountable-officer release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
