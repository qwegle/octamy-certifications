<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; font-weight: bold; text-anchor: middle; }
      .large-text { font-size: 14px; }
      .medium-text { font-size: 10px; }
      .small-text { font-size: 8px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="80" fill="#ff9933" rx="5"/>
  
  <!-- White stripe -->
  <rect y="27" width="120" height="26" fill="#ffffff"/>
  
  <!-- Green stripe -->
  <rect y="53" width="120" height="27" fill="#138808" rx="0 0 5 5"/>
  
  <!-- Ashoka Chakra (simplified) -->
  <circle cx="60" cy="40" r="12" fill="none" stroke="#000080" stroke-width="1"/>
  <g stroke="#000080" stroke-width="0.5">
    <!-- Spokes of the wheel -->
    <line x1="60" y1="28" x2="60" y2="52"/>
    <line x1="48" y1="40" x2="72" y2="40"/>
    <line x1="51.5" y1="31.5" x2="68.5" y2="48.5"/>
    <line x1="68.5" y1="31.5" x2="51.5" y2="48.5"/>
  </g>
  
  <!-- Text -->
  <text x="60" y="15" class="text medium-text" fill="#000">MAKE IN</text>
  <text x="60" y="72" class="text medium-text" fill="#fff">INDIA</text>
</svg>